; =============================================================================
; supervisor program config for the Knowledge Hub enrichment worker.
; Install as /etc/supervisord.d/kh-worker.conf (or wherever supervisor includes),
; then: supervisorctl reread && supervisorctl update && supervisorctl start kh-worker
;
; Mirrors the OCR sidecar pattern: loopback-only uvicorn, autorestart on crash.
; =============================================================================
[program:kh-worker]
directory=/var/www/vhosts/doctorshero.com/kh-worker
command=/var/www/vhosts/doctorshero.com/kh-worker/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 4410
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
user=helal
environment=PATH="/var/www/vhosts/doctorshero.com/kh-worker/venv/bin:%(ENV_PATH)s"
stdout_logfile=/var/log/kh-worker/out.log
stderr_logfile=/var/log/kh-worker/err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
